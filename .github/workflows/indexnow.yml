name: Search engine discovery

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview URLs without notifying IndexNow"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production') &&
       contains(github.event.deployment.environment, 'myblog'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify production revision belongs to main
        if: github.event_name == 'deployment_status'
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          git fetch origin main --depth=100
          git fetch origin "$DEPLOYED_SHA" --depth=2
          git merge-base --is-ancestor "$DEPLOYED_SHA" origin/main
          git checkout --detach "$DEPLOYED_SHA"
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/seo-changed-files.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate URL change selection
        run: node --test scripts/seo/indexnow-utils.test.mjs

      - name: Prepare manual Baidu URL submission list
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/seo/prepare-baidu.mjs --all --output "$RUNNER_TEMP/baidu-urls.txt"
          else
            node scripts/seo/prepare-baidu.mjs --changed-files "$RUNNER_TEMP/seo-changed-files.txt" --output "$RUNNER_TEMP/baidu-urls.txt"
          fi

      - name: Upload Baidu URL list
        uses: actions/upload-artifact@v4
        with:
          name: baidu-urls
          path: ${{ runner.temp }}/baidu-urls.txt
          retention-days: 7
          if-no-files-found: error

      - name: Notify IndexNow participating search engines
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              node scripts/seo/submit-indexnow.mjs --all --dry-run
            else
              node scripts/seo/submit-indexnow.mjs --all
            fi
          else
            node scripts/seo/submit-indexnow.mjs --changed-files "$RUNNER_TEMP/seo-changed-files.txt"
          fi
