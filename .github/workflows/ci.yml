name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify (unit / build / waline smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://myblog.example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (vitest)
        run: pnpm test

      - name: Validate paper cover provenance
        run: pnpm papers:check

      - name: Build (astro check + astro build)
        run: pnpm build

      - name: Audit frontend production dependencies
        run: pnpm audit:prod

      - name: Install Waline server dependencies
        run: pnpm --dir waline-server install --frozen-lockfile

      - name: Run Waline server smoke
        run: pnpm --dir waline-server smoke

      - name: Audit Waline server production dependencies
        run: pnpm audit:waline-server

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      SITE_URL: https://myblog.example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
