name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify (unit / build / waline smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://myblog.example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (vitest)
        run: pnpm test

      - name: Validate paper cover provenance
        run: pnpm papers:check

      - name: Build (astro check + astro build)
        run: pnpm build

      - name: Validate canonical sitemap parity
        run: pnpm seo:check-build

      - name: Test search engine submission helpers
        run: pnpm seo:test

      - name: Audit frontend production dependencies
        run: pnpm audit:prod

      - name: Install Waline server dependencies
        run: pnpm --dir waline-server install --frozen-lockfile

      - name: Run Waline server smoke
        run: pnpm --dir waline-server smoke

      - name: Audit Waline server production dependencies
        run: pnpm audit:waline-server

      # This artifact contains only public static assets. Publication still
      # requires the complete CI run (including E2E) to pass.
      - name: Package public static site
        env:
          SITE_URL: https://a-znk.com
          PUBLIC_WALINE_SERVER_URL: https://waline-smoky-five-24.vercel.app
        run: |
          pnpm exec astro build
          tar -czf site-static.tar.gz -C dist .
          sha256sum site-static.tar.gz > site-static.sha256
          git rev-parse HEAD > site-revision.txt

      - name: Upload public static site
        uses: actions/upload-artifact@v4
        with:
          name: public-static-site
          path: |
            site-static.tar.gz
            site-static.sha256
            site-revision.txt
          retention-days: 3

  e2e:
    name: E2E (Playwright)
    # Playwright 1.58.2 supports 24.04; ubuntu-latest can move ahead of its browser dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify
    env:
      SITE_URL: https://myblog.example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
