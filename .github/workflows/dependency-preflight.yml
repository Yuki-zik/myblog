name: Dependency Lockfile Preflight

# Fast fail for dependency changes pushed to feature branches.
# PRs and main retain the full CI, including security audits and Playwright.
on:
  push:
    branches-ignore:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - waline-server/package.json
      - waline-server/pnpm-lock.yaml
      - .github/workflows/dependency-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-lockfiles:
    name: Verify pnpm lockfiles (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify blog manifest / lockfile
        run: pnpm install --lockfile-only --frozen-lockfile --offline --ignore-scripts

      - name: Verify Waline manifest / lockfile
        run: pnpm --dir waline-server install --lockfile-only --frozen-lockfile --offline --ignore-scripts
