name: Observatory dependency lock refresh
on:
  push:
    branches: [feat/agent-observatory-20261024]
    paths: [package.json, .github/workflows/observatory-lock-refresh.yml]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched versions without install scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Emit public lockfile patch for review
        run: git -c color.ui=false diff --no-ext-diff -- pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: observatory-patched-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
