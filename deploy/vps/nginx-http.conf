# Static Astro release. Public TLS remains with the existing Xray service.
map $uri $blog_cache_control {
    default "public, max-age=300";
    ~^/_astro/ "public, max-age=31536000, immutable";
    /search-index.json "public, max-age=60, must-revalidate";
}
map "$host:$uri" $blog_robots {
    ~^(a-znk\.com|www\.a-znk\.com):.*\.md$ "noindex, follow";
    ~^(a-znk\.com|www\.a-znk\.com): "";
    default "noindex, nofollow";
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name a-znk.com www.a-znk.com;
    root /var/www/a-znk-blog/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/a-znk-blog.access.log;
    error_log /var/log/nginx/a-znk-blog.error.log;
    include /etc/nginx/snippets/a-znk-blog-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { return 404; }
    location = /404 { return 404; }
    location / { try_files $uri $uri/index.html $uri.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}

# Separate HTTPS mirror endpoint. Port 443 belongs to Xray and MUST remain unchanged.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vps.a-znk.com;
    root /var/www/a-znk-blog/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/vps.a-znk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.a-znk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BlogSSL:10m;
    access_log /var/log/nginx/a-znk-blog-tls.access.log;
    error_log /var/log/nginx/a-znk-blog-tls.error.log;
    include /etc/nginx/snippets/a-znk-blog-headers.conf;

    location ~ /\. { return 404; }
    location = /404 { return 404; }
    location / { try_files $uri $uri/index.html $uri.html =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
