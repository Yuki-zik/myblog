add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.swo.moe https://waline.example https://comments.example.com https://*.vercel.app; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header Cache-Control $blog_cache_control always;
add_header X-Robots-Tag $blog_robots always;
