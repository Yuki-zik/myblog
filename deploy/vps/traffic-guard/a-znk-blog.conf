# a-znk.com: blog mirror traffic guard (2026-10-19)
# Scope: HTTP 80 for ACME + redirect, HTTPS 8443 for vps.a-znk.com.
# Primary a-znk.com stays on Vercel. Xray 443/24443 and SSH 13424 are untouched.
# APNIC CN coverage is allocation-based, not reliable proof of physical geography.

map $uri $blog_cache_control {
    default "public, max-age=300";
    ~^/_astro/ "public, max-age=31536000, immutable";
    /search-index.json "public, max-age=60, must-revalidate";
}
map "$host:$uri" $blog_robots {
    ~^(a-znk\.com|www\.a-znk\.com):.*\.md$ "noindex, follow";
    ~^(a-znk\.com|www\.a-znk\.com): "";
    default "noindex, nofollow";
}

geo $blog_cn_client {
    default 0;
    127.0.0.0/8 1;      # Local-only health checks
    ::1/128 1;
    include /etc/nginx/blog-cn-cidrs.conf;
}

limit_req_zone $binary_remote_addr zone=blog_requests_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=blog_connections_per_ip:10m;

# Unknown hostnames and bare-IP HTTP scans receive no page body.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/a-znk-blog-denied.access.log;
    return 444;
}

# Keep HTTP-01 challenge public for automated Let's Encrypt renewals.
server {
    listen 80;
    listen [::]:80;
    server_name vps.a-znk.com;
    server_tokens off;
    access_log /var/log/nginx/a-znk-blog-http.access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://vps.a-znk.com:8443$request_uri;
    }
}

# Unknown TLS SNI is rejected before a full TLS handshake.
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

# TLS blog mirror. China mainland IP allocations can read pages here.
# Other visitors get a small 302 response and use Vercel instead.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vps.a-znk.com;
    root /var/www/a-znk-blog/current;
    index index.html;
    server_tokens off;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/vps.a-znk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.a-znk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BlogSSL:10m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/json application/javascript application/xml image/svg+xml;

    limit_req zone=blog_requests_per_ip burst=40 nodelay;
    limit_req_status 429;
    limit_conn blog_connections_per_ip 12;
    limit_conn_status 429;

    access_log /var/log/nginx/a-znk-blog-tls.access.log;
    error_log /var/log/nginx/a-znk-blog-tls.error.log;
    include /etc/nginx/snippets/a-znk-blog-headers.conf;

    if ($host != vps.a-znk.com) { return 444; }
    if ($blog_cn_client = 0) { return 302 https://a-znk.com$request_uri; }
    if ($request_method !~ ^(GET|HEAD)$) { return 444; }

    location ~ /\. { return 404; }
    location = /404 { return 404; }
    location / { try_files $uri $uri/index.html $uri.html =404; }

    # A 60kB custom error page is wasteful for automated URL scanners.
    # Keep real HTTP 404 with a tiny response on this secondary mirror.
    error_page 404 = @blog_small_404;
    location @blog_small_404 {
        internal;
        default_type text/plain;
        return 404 "Not Found\n";
    }
    location = /404.html { internal; }
}
