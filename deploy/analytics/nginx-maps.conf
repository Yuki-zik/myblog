# Install in HTTP context, before the existing blog server (not inside location).
map $uri $blog_analytics_request {
    default 0;
    ~^/analytics(?:/|$) 1;
    ~^/_analytics/(?:count$|counter/) 1;
}
map "$blog_cn_client:$blog_analytics_request" $blog_mirror_redirect {
    default 0;
    "0:0" 1;
}
map "$request_method:$blog_analytics_request" $blog_method_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    "POST:1" 1;
    "PUT:1" 1;
    "DELETE:1" 1;
    "PATCH:1" 1;
    "OPTIONS:1" 1;
}
# Preserve the raw escaped article path, including %2F, through the mirror proxy.
map $request_uri $blog_analytics_upstream_uri {
    ~^/_analytics/(.*)$ /analytics/$1;
    default $request_uri;
}
# Expose only counts for public article routes, not TOTAL, events or dashboard APIs.
map $request_uri $blog_analytics_counter_allowed {
    default 0;
    ~^/(?:_analytics|analytics)/counter/(?:%2[Ff]|/)(?:en(?:%2[Ff]|/))?posts(?:%2[Ff]|/)[a-z0-9][a-z0-9-]*\.json(?:\?|$) 1;
}

map $request_uri $blog_analytics_counter_file {
    default /__unavailable__;
    ~^/(?:_analytics|analytics)/counter/(?:%2[Ff]|/)en(?:%2[Ff]|/)posts(?:%2[Ff]|/)(?<blog_counter_en_slug>[a-z0-9][a-z0-9-]*)\.json(?:\?|$) /en/$blog_counter_en_slug.json;
    ~^/(?:_analytics|analytics)/counter/(?:%2[Ff]|/)posts(?:%2[Ff]|/)(?<blog_counter_zh_slug>[a-z0-9][a-z0-9-]*)\.json(?:\?|$) /zh/$blog_counter_zh_slug.json;
}
