# Install in HTTP context, before the existing blog server (not inside location).
map $uri $blog_analytics_request {
    default 0;
    ~^/analytics(?:/|$) 1;
    ~^/_analytics/(?:count$|counter/) 1;
}
map "$blog_cn_client:$blog_analytics_request" $blog_mirror_redirect {
    default 0;
    "0:0" 1;
}
map "$request_method:$blog_analytics_request" $blog_method_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    "POST:1" 1;
    "PUT:1" 1;
    "DELETE:1" 1;
    "PATCH:1" 1;
    "OPTIONS:1" 1;
}
# Preserve the raw escaped article path, including %2F, through the mirror proxy.
map $request_uri $blog_analytics_upstream_uri {
    ~^/_analytics/(.*)$ /analytics/$1;
    default $request_uri;
}
# Expose only counts for public article routes, not TOTAL, events or dashboard APIs.
map $request_uri $blog_analytics_counter_allowed {
    default 0;
    ~^/(?:_analytics|analytics)/counter/(?:%2[Ff]|/)(?:en(?:%2[Ff]|/))?posts(?:%2[Ff]|/)[a-z0-9][a-z0-9-]*\.json(?:\?|$) 1;
}

map $request_uri $blog_analytics_counter_file {
    default /__unavailable__;
    ~^/(?:_analytics|analytics)/counter/(?:%2[Ff]|/)en(?:%2[Ff]|/)posts(?:%2[Ff]|/)(?<blog_counter_en_slug>[a-z0-9][a-z0-9-]*)\.json(?:\?|$) /en/$blog_counter_en_slug.json;
    ~^/(?:_analytics|analytics)/counter/(?:%2[Ff]|/)posts(?:%2[Ff]|/)(?<blog_counter_zh_slug>[a-z0-9][a-z0-9-]*)\.json(?:\?|$) /zh/$blog_counter_zh_slug.json;
}

# Category C & D: parasitic commercial SEO crawlers, bulk scrapers & exploit scanners.
# Search & AI retrieval/training crawlers (Googlebot, Bingbot, Baiduspider, OAI-SearchBot,
# GPTBot, Claude-SearchBot, ClaudeBot, PerplexityBot, Applebot, Bytespider) stay allowed (0).
map $http_user_agent $blog_bad_bot_ua {
    default 0;
    ~*(?:SemrushBot|AhrefsBot|MJ12bot|BLEXBot|DotBot|DataForSeoBot|PetalBot|SeekportBot|ZoominfoBot|TurnitinBot|Omgilibot|Scrapy|python-requests|python-urllib|Go-http-client|libwww-perl|CensysInspect|CyberConvoyScout|zgrab|masscan|nuclei|sqlmap|nikto|dirbuster|gobuster|wfuzz|ffuf) 1;
}

# Category D: vulnerability probe & exploit paths dropped with 0-byte 444.
map $uri $blog_exploit_uri {
    default 0;
    ~*(?:^/(?:wp-admin|wp-login|wp-includes|wp-content|xmlrpc\.php|phpmyadmin|pma|myadmin|cgi-bin|SDK|boaform|HNAP1|GponForm|actuator|vendor/phpunit|admin/config\.php|setup\.cgi)(?:/|$)|(?:\.(?:php|asp|aspx|jsp|cgi|env|git|svn|bak|sql|ini|log))$|^/\.(?!well-known/)) 1;
}

# Hotlink guard for /_astro/* article figures only (/og/*.png remains public for social cards).
map $http_referer $blog_hotlink_blocked {
    default 0;
    "~*^https?://(?:[^/]+\.)?(?:a-znk\.com|google\.[a-z.]+|bing\.com|baidu\.com|zhihu\.com|github\.com|orcid\.org)(?::\d+)?(?:/|$)" 0;
    "~*^https?://" 1;
}

# Analytics anti-pollution: drop crawler/headless UAs and arbitrary forged ?p= paths before SQLite.
map $http_user_agent $blog_analytics_bot_ua {
    default 0;
    "" 1;
    ~*(?:googlebot|bingbot|baiduspider|yandexbot|duckassistbot|oai-searchbot|gptbot|claudebot|claude-searchbot|perplexitybot|applebot|bytespider|petalbot|semrushbot|ahrefsbot|mj12bot|blexbot|dotbot|ccbot|headlesschrome|phantomjs|selenium|playwright|puppeteer|lighthouse|pagespeed|gtmetrix|pingdom|uptimerobot|censys|cyberconvoy|curl/|wget/|python-|go-http-client|java/|scrapy|zgrab|nuclei|sqlmap) 1;
}

map $arg_p $blog_analytics_valid_p {
    default 0;
    "~^(?:(?:read_(?:25|50|75|90)|active_(?:30|60|180)s|bionic_(?:on|off)|language_switch|outbound_(?:telegram|discord|github|email|rss|external))(?:%3[Aa]|:))?(?:%2[Ff]|/)(?:$|en$|(?:en(?:%2[Ff]|/))?(?:(?:author|archives|map|agents|papers|topics|privacy)$|(?:posts|papers|topics|concepts)(?:%2[Ff]|/)[a-z0-9][a-z0-9-]{0,160}$))" 1;
}

map "$request_method:$blog_analytics_bot_ua:$blog_analytics_valid_p" $blog_analytics_count_allowed {
    default 0;
    "POST:0:1" 1;
}

limit_req_zone $binary_remote_addr zone=blog_analytics_count_per_ip:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=blog_analytics_login_per_ip:1m rate=5r/m;
