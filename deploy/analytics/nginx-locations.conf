# Install in the existing vps.a-znk.com:8443 server. Never take over 443/24443.
location = /analytics { return 308 /analytics/; }
location ^~ /analytics/counter/ {
    if ($blog_analytics_counter_allowed = 0) { return 404; }
    include /etc/nginx/snippets/blog-analytics-proxy.conf;
}
location ^~ /analytics/ {
    include /etc/nginx/snippets/blog-analytics-proxy.conf;
}
location = /_analytics/count {
    include /etc/nginx/snippets/blog-analytics-proxy.conf;
}
location ^~ /_analytics/counter/ {
    if ($blog_analytics_counter_allowed = 0) { return 404; }
    include /etc/nginx/snippets/blog-analytics-proxy.conf;
}
